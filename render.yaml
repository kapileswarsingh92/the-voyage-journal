# Render "Blueprint" — lets Render read this file and set the whole
# service up in one go (Dashboard → New → Blueprint → point at this repo)
# instead of clicking through every setting by hand. See the deployment
# steps in README.md for the full walkthrough.
#
# This defines a paid Starter web service with a small persistent disk
# mounted at /var/data, so the SQLite database and every uploaded photo
# survive deploys/restarts — the free plan can't attach a disk at all, and
# without one this app would lose its data every time it redeploys.
services:
  - type: web
    name: the-voyage-journal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # --timeout 150: a low-resolution photo gets AI-upscaled (see
    # REPLICATE_API_TOKEN below) before it's saved, which can take up to
    # ~90s in the worst case (cold-start included) — gunicorn's default
    # 30s worker timeout would kill that request partway through.
    # --workers 2: gunicorn defaults to a single worker, which means that
    # same up-to-90s upscale request would block every other visitor from
    # being served at all until it finished. Two workers let a second
    # request through while the first is busy — still comfortably within
    # the Starter plan's memory for an app this size.
    startCommand: gunicorn run:app --timeout 150 --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/voyage_journal.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional: enables automatic AI upscaling of low-resolution photos
      # (via Replicate's Real-ESRGAN model) on upload. Leave unset and the
      # site behaves exactly as before — small photos are saved as-is.
      # Set your own key in the Render dashboard; sync: false keeps it out
      # of this file / git.
      - key: REPLICATE_API_TOKEN
        sync: false
    disk:
      name: voyage-journal-data
      mountPath: /var/data
      sizeGB: 1
